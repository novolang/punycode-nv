[package]
name        = "punycode-nv"
version     = "0.1.0"
description = "RFC 3492 punycode and UTS #46 IDNA: the bootstring parameters as a @value and the delta arithmetic in registers, encode and decode into a buffer the caller already owns, and ToASCII and ToUnicode over a whole domain with the mapping, the normalisation, the label length rules and the bidi and contextual checks each named and scoped."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`: arithmetic over characters the caller already holds.  No
# function declares an effect, nothing is read and nothing is written.
# The normalisation tables arrive as a `UniData` the caller names.  The
# UTS #46 mapping table, the bidirectional classes and the joining
# types are constants in `punyidna`, written by tools/idna_tables.py.
#
# It carries `tests/embedded_probe.nv`, which builds `punyboot` for a
# Cortex-M4 and checks seven answers on it under QEMU, and
# `tests/alloc_scan.sh`, which checks that no function in `punyboot`
# calls the allocator.  The consumer is a device with a display:
# showing a domain name to a person is a decision firmware cannot
# delegate to its host.
layer       = "core"

category    = "encoding"

tags = ["punycode", "idna", "uts46", "rfc3492", "domain-names", "unicode", "embedded"]
repository  = "https://github.com/novolang/punycode-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "The four bytes in front of an international domain name"

[dependencies]
# unicode-nv supplies NFC normalisation (`unorm.normalize`), the
# canonical combining class a joiner rule reads, whether a code point
# is a combining mark (`uclass.is_mark`), and the `UniData` they read.
# It carries no UTS #46 mapping table, no Bidi_Class and no
# Joining_Type, so those are this package's own tables.
#
# `punyboot` uses none of it, which is what keeps the device claim.
unicode-nv = "^0.1.3"

# Not url-nv, and the direction is worth stating: url-nv is this
# package's consumer rather than its dependency.  Its host parser
# refuses a byte above 127 with `IdnaUnsupported` today, and the README
# says exactly which call here replaces that refusal.
